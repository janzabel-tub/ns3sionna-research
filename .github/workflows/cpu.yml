name: CPU regressions
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: nsnam/ns-3-dev-git
          ref: 4fdc985b5d5b800992e0ce87df7a727e32033794 # ns-3.40
          path: ns-3.40
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: ns-3.40/contrib/sionna
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.12'
      - name: System dependencies
        run: |
          mkdir -p ns-3.40/ci-logs
          sudo apt-get update 2>&1 | tee ns-3.40/ci-logs/system.log
          sudo apt-get install -y cmake ninja-build g++ pkg-config libzmq3-dev cppzmq-dev libprotobuf-dev protobuf-compiler llvm 2>&1 | tee -a ns-3.40/ci-logs/system.log
      - name: Pinned Python environment
        run: |
          python -m pip install pip==26.0.1 2>&1 | tee ns-3.40/ci-logs/python-install.log
          python -m pip install --no-deps -r ns-3.40/contrib/sionna/model/ns3sionna/requirements_cpu_ci.lock 2>&1 | tee -a ns-3.40/ci-logs/python-install.log
          python -m pip check 2>&1 | tee -a ns-3.40/ci-logs/python-install.log
      - name: Fresh bindings and native build
        working-directory: ns-3.40
        run: |
          mkdir -p ci-logs
          rm -f contrib/sionna/model/message.pb.cc contrib/sionna/model/message.pb.h contrib/sionna/model/ns3sionna/common/message_pb2.py
          ./ns3 configure --enable-examples --enable-tests --enable-modules=sionna,wifi,internet,applications,buildings 2>&1 | tee ci-logs/configure.log
          ./ns3 build -j 2 test-runner sionna-test ns3_wifi_sumimo_benchmark ns3_sionna_cache_ipc_benchmark 2>&1 | tee ci-logs/build.log
          test -s contrib/sionna/model/ns3sionna/common/message_pb2.py
      - name: Native, contract, calibration, policy and frozen export checks
        working-directory: ns-3.40
        run: python contrib/sionna/tools/run_cpu_regressions.py 2>&1 | tee ci-logs/regressions.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: cpu-logs
          path: ns-3.40/ci-logs/
